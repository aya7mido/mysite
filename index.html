<!doctype html>
<html lang='ja'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>Idol Costume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="aurora"></div>
    <div class="sparkles"></div>
    <div class="pearls"></div>
    <header class="header">
        <nav>
            <h1>Idol Costume</h1>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#movie">Movie</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero reveal">
        <div class="hero-copy">
            <p class="tag">Japanese Idol Costumes</p>
            <h2>アイドル衣装</h2>
            <a href="#gallery" class="button">Gallery</a>
        </div>
        <div class="hero-photo frame"><img src="images/main3.png" alt=""></div>
    </section>

    <section id="about" class="reveal">
        <h2>Why I Love Idol Costumes</h2>
        <div class="cards">
            <article class="card"><span>🎀</span>
                <h3>日本ならではのデザイン</h3>
                <p>フリルやレースなど繊細な装飾が魅力</p>
            </article>
            <article class="card"><span>✨</span>
                <h3>一人ひとりに合わせた衣装</h3>
                <p>一人ひとりに合わせた衣装</p>
            </article>
            <article class="card"><span>💎</span>
                <h3>生地から制作</h3>
                <p>柄や素材までこだわった作品のような衣装</p>
            </article>
        </div>
    </section>

    <section id="gallery" class="reveal">
        <h2>Favorite Costumes</h2>
        <div class="gallery">
            <figure><img src="images/costume1.png" alt="Gingham check">
                <figcaption>Gingham check</figcaption>
            </figure>
            <figure><img src="images/costume2.png" alt="China">
                <figcaption>China</figcaption>
            </figure>
            <figure><img src="images/costume3.png" alt="Crystal Stage">
                <figcaption>Crystal Stage</figcaption>
            </figure>
            <figure><img src="images/costume4.png" alt="Animal">
                <figcaption>Animal</figcaption>
            </figure>
            <figure><img src="images/costume5.png" alt="Gingham Ribbon">
                <figcaption>Gingham Ribbon</figcaption>
            </figure>
            <figure><img src="images/costume6.png" alt="Magical Girl">
                <figcaption>Magical Girl</figcaption>
            </figure>
            <figure><img src="images/costume7.png" alt="Toy Fantasy">
                <figcaption>Toy Fantasy</figcaption>
            </figure>
            <figure><img src="images/costume8.png" alt="Flower Serenade">
                <figcaption>Flower Serenade</figcaption>
            </figure>
        </div>
        </div>
    </section>

    <section id="movie" class="reveal">
        <h2>Movie</h2>
        <div class="movieframe"><video controls>
                <source src="video/0805.mp4">
            </video></div>
    </section>

    <footer>✦ Idol Costume Collection ✦</footer>
    <script src="js/script.js"></script>
    <div class="lightbox-overlay" id="lightbox">
        <button class="lightbox-close" aria-label="close">&times;</button>
        <figure class="lightbox-figure">
            <img id="lightbox-image" src="" alt="">
            <figcaption id="lightbox-caption"></figcaption>
        </figure>
    </div>
</body>

</html>
